[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olci-cross-comparison-swot-s6"
version = "0.1.0"
description = "Spatio-temporal field-of-view matchups between Sentinel-3 OLCI, SWOT KaRIn, and Sentinel-6"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cmocean>=4.0,<5",
  "earthaccess>=0.15,<1",
  "eumdac>=3.0,<4",
  "geopandas>=1.0,<2",
  "h5netcdf>=1.4,<2",
  "h5py>=3.12,<4",
  "matplotlib>=3.9,<4",
  "netCDF4>=1.7,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pillow>=10,<13",
  "pyogrio>=0.9,<1",
  "pyproj>=3.6,<4",
  "requests>=2.32,<3",
  "scipy>=1.13,<2",
  "shapely>=2.0,<3",
  "tqdm>=4.66,<5",
  "xarray>=2025.1,<2027",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
find-s3-swot = "satmatch.cli:main"
find-s3a-swot = "satmatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Passing 'N' to ListedColormap is deprecated since 3.11:matplotlib.MatplotlibDeprecationWarning",
]
